# Setup taken from https://codspeed.io/docs/benchmarks/nodejs/vitest
name: Benchmarks

on:
  push:
    # Broad on purpose: CodSpeed compares each PR against the run on its
    # merge-base commit. Skipping main pushes that don't touch packages/**
    # (pnpm config, CI, root tooling) leaves those commits without a baseline
    # run, and CodSpeed silently falls back to an older, possibly outlier run —
    # which then flags phantom regressions on every PR until the next eligible
    # push. Only paths that cannot affect benchmark results are excluded.
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'e2e/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'benchmarks/**'
  workflow_dispatch:
    inputs:
      cpu-only:
        description: Run only CPU simulation benchmarks
        type: boolean
        default: false

concurrency:
  group: client-nav-benchmarks-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false
  queue: single

permissions:
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  SERVER_PRESET: 'node-server'
  NX_NO_CLOUD: true

jobs:
  benchmarks:
    name: Run ${{ matrix.benchmark }}:${{ matrix.framework }} CodSpeed benchmark
    strategy:
      fail-fast: false
      matrix:
        framework:
          - react
        benchmark: [ssr]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@e4b48f16568324f76f467aa4c2aac2f05db632c3 # main

      # Run the build outside of the CodSpeed action to avoid being slowed by intrumentation overhead.
      # (and then run the task itself with --excludeTaskDependencies)
      - name: Prepare ${{ matrix.benchmark }}:${{ matrix.framework }} benchmark
        run: >-
          pnpm nx run
          @benchmarks/${{ matrix.benchmark }}:build:${{ matrix.framework }}

      - name: Add diagnostic measurement markers
        working-directory: benchmarks/ssr
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = new URL('./analysis.mjs', import.meta.resolve('@codspeed/vitest-plugin'));
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes("InstrumentHooks.startBenchmark();")) { throw new Error("Missing instrumentation marker") }
          source = source.replace("InstrumentHooks.startBenchmark();", "process.stdout.write(\"GC_MEASURE_BEGIN\\n\"); InstrumentHooks.startBenchmark();");
          if (!source.includes("InstrumentHooks.stopBenchmark();")) { throw new Error("Missing instrumentation marker") }
          source = source.replace("InstrumentHooks.stopBenchmark();", "InstrumentHooks.stopBenchmark(); process.stdout.write(\"GC_MEASURE_END\\n\");");
          fs.writeFileSync(file, source);
          JS

      - name: Run ${{ matrix.benchmark }}:${{ matrix.framework }} CodSpeed benchmark
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        timeout-minutes: 20
        with:
          mode: ${{ startsWith(matrix.benchmark, 'memory-') && 'memory' || 'simulation' }}
          run: >-
            WITH_INSTRUMENTATION=1
            pnpm nx run
            @benchmarks/${{ matrix.benchmark }}:test:perf:${{ matrix.framework }}
            --excludeTaskDependencies
            -- --project '*assets*'
