# Setup taken from https://codspeed.io/docs/benchmarks/nodejs/vitest
name: Benchmarks

on:
  push:
    # Broad on purpose: CodSpeed compares each PR against the run on its
    # merge-base commit. Skipping main pushes that don't touch packages/**
    # (pnpm config, CI, root tooling) leaves those commits without a baseline
    # run, and CodSpeed silently falls back to an older, possibly outlier run —
    # which then flags phantom regressions on every PR until the next eligible
    # push. Only paths that cannot affect benchmark results are excluded.
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'e2e/**'
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/**/tests/**'
      - '!packages/**/__tests__/**'
      - '!packages/**/*.test.*'
      - 'benchmarks/**'
  workflow_dispatch:

concurrency:
  # An empty Nx rerun must not replace the preceding run in the pending queue.
  group: client-nav-benchmarks-${{ github.ref }}${{ github.actor == 'nx-cloud[bot]' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false
  queue: single

permissions:
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  SERVER_PRESET: 'node-server'
  NX_NO_CLOUD: true

jobs:
  check_nx_rerun:
    name: Check Nx Cloud rerun
    # Ordinary updates skip this job without acquiring a runner.
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.actor == 'nx-cloud[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check commit message and tree
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.setOutput('skip', 'false')
            try {
              const { before, pull_request } = context.payload
              if (!before) {
                return
              }
              const { data: head } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: pull_request.head.sha,
              })
              if (!head.commit.message.includes('[Self-Healing CI Rerun]')) {
                return
              }
              const { data: previous } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: before,
              })
              // Compare with the previous PR head, not just the parent: a push
              // could contain real changes followed by an empty rerun commit.
              core.setOutput('skip', head.commit.tree.sha === previous.commit.tree.sha)
            } catch {
              core.warning('Could not verify an empty Nx Cloud rerun; running benchmarks.')
            }

  benchmarks:
    name: Run ${{ matrix.benchmark }}:${{ matrix.framework }} CodSpeed benchmark
    needs: check_nx_rerun
    # A skipped or failed check must still allow benchmarks; respect cancellation.
    if: ${{ !cancelled() && needs.check_nx_rerun.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        framework:
          - react
          - solid
          - vue
        benchmark:
          - client-nav
          - ssr
          - memory-server
          - memory-client
        include:
          - benchmark: client-nav
            mode: simulation
          - benchmark: ssr
            mode: simulation
          - benchmark: memory-server
            mode: memory
          - benchmark: memory-client
            mode: memory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@e4b48f16568324f76f467aa4c2aac2f05db632c3 # main

      # Run the build outside of the CodSpeed action to avoid being slowed by intrumentation overhead.
      # (and then run the task itself with --excludeTaskDependencies)
      - name: Prepare ${{ matrix.benchmark }}:${{ matrix.framework }} benchmark
        run: >-
          pnpm nx run
          @benchmarks/${{ matrix.benchmark }}:build:${{ matrix.framework }}

      - name: Run ${{ matrix.benchmark }}:${{ matrix.framework }} CodSpeed benchmark
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        timeout-minutes: 20
        with:
          mode: ${{ matrix.mode }}
          run: >-
            WITH_INSTRUMENTATION=1
            pnpm nx run
            @benchmarks/${{ matrix.benchmark }}:test:perf:${{ matrix.framework }}
            --excludeTaskDependencies
