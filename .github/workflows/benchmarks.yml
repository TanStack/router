# Setup taken from https://codspeed.io/docs/benchmarks/nodejs/vitest
name: Benchmarks

on:
  push:
    # Broad on purpose: CodSpeed compares each PR against the run on its
    # merge-base commit. Skipping main pushes that don't touch packages/**
    # (pnpm config, CI, root tooling) leaves those commits without a baseline
    # run, and CodSpeed silently falls back to an older, possibly outlier run —
    # which then flags phantom regressions on every PR until the next eligible
    # push. Only paths that cannot affect benchmark results are excluded.
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'e2e/**'
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/**/tests/**'
      - '!packages/**/__tests__/**'
      - '!packages/**/*.test.*'
      - 'benchmarks/**'
      - '.nvmrc'
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
  queue: single

permissions:
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  SERVER_PRESET: 'node-server'
  NX_NO_CLOUD: true

jobs:
  benchmarks:
    name: Run ${{ matrix.benchmark }}:${{ matrix.framework }} CodSpeed benchmark
    strategy:
      fail-fast: false
      matrix:
        framework:
          - react
          - solid
          - vue
        benchmark:
          - client-nav
          - ssr
          - memory-server
          - memory-client
        include:
          - benchmark: client-nav
            mode: simulation
          - benchmark: ssr
            mode: simulation
          - benchmark: memory-server
            mode: memory
          - benchmark: memory-client
            mode: memory
    # Pinned to ubuntu-24.04 (not ubuntu-latest) because:
    # - `mode: simulation` (client-nav, ssr) runs under CodSpeed's own valgrind
    #   build, which only exists for specific Ubuntu releases. ubuntu-latest moved
    #   to 26.04 in Nov 2026, and the runner bundled with CodSpeedHQ/action v5.2.1
    #   (runner 5.2.1) fails there with a bare "Unsupported system" error.
    #   `mode: memory` doesn't use valgrind, so only the CPU jobs broke.
    # - An OS change silently shifts every CodSpeed baseline, so OS upgrades
    #   should be deliberate, not whenever GitHub moves ubuntu-latest.
    #
    # Blocker for moving to 26.04 / ubuntu-latest: Ubuntu 26.04 support landed in
    # CodSpeedHQ/runner v5.7.0, but no CodSpeedHQ/action release bundles it yet
    # (v5.6.3 ships runner 5.6.3). Check the `.codspeed-runner-version` file at
    # https://github.com/CodSpeedHQ/action. Once an action release ships runner
    # >= 5.7.0, bump the action pin below and this `runs-on` in the same PR,
    # and expect a one-time jump in every baseline.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: TanStack/config/.github/setup@a041f4eeb8e4d595aee89f8992b20c669288a741 # main

      # Run the build outside of the CodSpeed action to avoid being slowed by intrumentation overhead.
      # (and then run the task itself with --excludeTaskDependencies)
      - name: Prepare ${{ matrix.benchmark }}:${{ matrix.framework }} benchmark
        run: >-
          pnpm nx run
          @benchmarks/${{ matrix.benchmark }}:build:${{ matrix.framework }}

      - name: Run ${{ matrix.benchmark }}:${{ matrix.framework }} CodSpeed benchmark
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        timeout-minutes: 20
        with:
          mode: ${{ matrix.mode }}
          run: >-
            WITH_INSTRUMENTATION=1
            pnpm nx run
            @benchmarks/${{ matrix.benchmark }}:test:perf:${{ matrix.framework }}
            --excludeTaskDependencies
