name: Bun Router

on:
  pull_request:
    paths:
      - 'packages/router-plugin/**'
      - 'packages/router-generator/**'
      - 'packages/router-utils/**'
      - 'packages/virtual-file-routes/**'
      - 'packages/router-core/**'
      - 'packages/react-router/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
      - 'tsconfig.json'
      - 'scripts/nx/**'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/bun.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: '1'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  router:
    name: Bun Router (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter .
          --filter "@tanstack/router-plugin..."
          --filter "@tanstack/react-router..."
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Install Chromium (Windows and macOS)
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium --only-shell
      - name: Test production builds and navigation
        run: pnpm nx run @tanstack/router-plugin:test:e2e:bun --outputStyle=stream --skipRemoteCache
