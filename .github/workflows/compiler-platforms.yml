name: Compiler Platforms

# The main PR workflow only runs on Linux x64 (glibc). The compilers load a
# native Yuku binary per platform and handle platform-specific paths, so run
# their unit tests and a Vite and Rsbuild production build on the other
# platforms we ship to.

on:
  pull_request:
    paths:
      - 'packages/router-utils/**'
      - 'packages/router-generator/**'
      - 'packages/router-plugin/**'
      - 'packages/start-plugin-core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/compiler-platforms.yml'
  schedule:
    # Weekly, to catch new Yuku releases and runner image updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

defaults:
  run:
    shell: bash

jobs:
  compiler:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # actions/setup-node only ships glibc builds, so musl uses Alpine's Node image
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Linux x64 musl
            os: ubuntu-latest
            container: node:24.8.0-alpine3.22@sha256:3e843c608bb5232f39ecb2b25e41214b958b0795914707374c8acc28487dea17
    steps:
      - name: Install system packages
        if: ${{ matrix.container }}
        shell: sh
        run: apk add --no-cache bash git
      - name: Keep LF line endings
        # Snapshots are stored with LF. Windows runners check out CRLF by default,
        # and with `* text=auto` disabling autocrlf alone still uses the native eol
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        if: ${{ !matrix.container }}
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      - name: Setup Node
        if: ${{ !matrix.container }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Setup pnpm (container)
        if: ${{ matrix.container }}
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter .
          --filter "@tanstack/router-utils..."
          --filter "@tanstack/router-generator..."
          --filter "@tanstack/router-plugin..."
          --filter "@tanstack/start-plugin-core..."
          --filter "tanstack-react-start-e2e-basic..."
      - name: Unit tests
        run: >-
          pnpm nx run-many --targets=test:unit
          --projects=@tanstack/router-utils,@tanstack/router-generator,@tanstack/router-plugin,@tanstack/start-plugin-core
          --skip-nx-cache --outputStyle=static
      - name: Production builds
        run: >-
          pnpm nx run-many --targets=build:vite:ssr,build:rsbuild:ssr
          --projects=tanstack-react-start-e2e-basic
          --skip-nx-cache --outputStyle=static
