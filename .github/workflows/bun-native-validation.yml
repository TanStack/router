name: Temporary native Bun regression validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CI: '1'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  native:
    if: github.repository == 'RentnerKev/router'
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Download verified final native binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40091857136 --repo "$GITHUB_REPOSITORY" --name native-macos-arm64-bun --dir .native-artifact
      - name: Checkout matching native regression sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RentnerKev/bun
          ref: dca7d25e95cca39316c659a377dba6803805549f
          path: .cache/native-bun-validation/test-source
          persist-credentials: false
      - name: Verify watch-path oracle and run native regressions
        id: native_tests
        continue-on-error: true
        run: python3 .github/native-bun-validation/artifact-tests.py
      - name: Run native Chrome tests with Bun's CI runner
        id: chrome
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .github/native-bun-validation/chrome-test.py
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-arm64-final-regressions
          path: .native-browser-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Require actual regression outcomes
        if: always()
        env:
          NATIVE: ${{ steps.native_tests.outcome }}
          CHROME: ${{ steps.chrome.outcome }}
        run: '[[ "$NATIVE" == success && "$CHROME" == success ]]'
