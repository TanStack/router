services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: start_demo
      POSTGRES_PASSWORD: start_demo
      POSTGRES_DB: start_demo
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U start_demo -d start_demo']
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
